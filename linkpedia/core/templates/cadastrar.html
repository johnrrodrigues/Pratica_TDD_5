<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Novo Link - LinkPedia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.3);
      background-color: #f8f9fa;
      color: #343a40;
      padding: 2rem;
      width: 100%;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div class="card">
      <h2 class="mb-4 text-center text-primary"><i class="fas fa-plus-circle me-2"></i>Novo Endereço</h2>
      
      <form method="POST">
        {% csrf_token %}
        
        {% for field in form %}
          <div class="mb-3 text-start">
            <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <div class="text-danger small mt-1">
                {% for error in field.errors %}{{ error }}{% endfor %}
              </div>
            {% endif %}
          </div>
        {% endfor %}
        
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'home' %}" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i>Voltar</a>
          <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Salvar Link</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
