<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Links Cadastrados - LinkPedia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: white;
        min-height: 100vh;
        padding: 2rem 0;
      }
      .card {
        border: none;
        border-radius: 1rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.3);
        background-color: #f8f9fa;
        color: #343a40;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="text-dark">
            <i class="fas fa-list-ul me-2 text-secondary"></i>Meus Links
          </h2>
          <a href="{% url 'cadastrar_link' %}" class="btn btn-primary"
            ><i class="fas fa-plus me-2"></i>Adicionar Novo</a
          >
        </div>
        <form
          method="GET"
          action="{% url 'listar_links' %}"
          class="mb-4 d-flex">
          <input
            type="text"
            name="busca"
            class="form-control me-2"
            placeholder="Pesquisar links por título..."
            value="{{ busca }}" />
          <button type="submit" class="btn btn-secondary px-4">
            <i class="fas fa-search"></i>
          </button>
        </form>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Título</th>
                <th>URL</th>
                <th>Observações</th>
              </tr>
            </thead>
            <tbody>
              {% for link in links %}
              <tr>
                <td><strong>{{ link.titulo }}</strong></td>
                <td>
                  <a href="{{ link.link }}" target="_blank" class="text-break"
                    >{{ link.link }}</a
                  >
                </td>
                <td>{{ link.observacao|default:"---" }}</td>
              </tr>
              {% empty %}
              <tr>
                <td colspan="3" class="text-center text-muted py-4">
                  Nenhum endereço cadastrado até o momento.
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
        <div class="mt-3">
          <a href="{% url 'home' %}" class="btn btn-outline-dark"
            ><i class="fas fa-home me-2"></i>Voltar ao Painel</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
