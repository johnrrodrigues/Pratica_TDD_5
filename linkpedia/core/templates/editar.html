<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Editar Link - LinkPedia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
      }
      .card-form {
        border: none;
        border-radius: 1rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.3);
        background-color: #f8f9fa;
        color: #343a40;
        padding: 2rem;
        width: 100%;
        max-width: 600px;
      }
      .errorlist {
        list-style: none;
        padding-left: 0;
        color: #dc3545;
        font-size: 0.875rem;
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div class="card card-form">
      <h2 class="mb-4 text-center text-warning">
        <i class="fas fa-edit me-2"></i>Alterar Link
      </h2>

      <form method="POST">
        {% csrf_token %} {% if form.non_field_errors %}
        <div class="alert alert-danger">
          {% for error in form.non_field_errors %} {{ error }} {% endfor %}
        </div>
        {% endif %}

        <div class="mb-3">
          <label class="form-label"
            ><strong>{{ form.titulo.label }}</strong></label
          >
          {{ form.titulo }} {{ form.titulo.errors }}
        </div>

        <div class="mb-3">
          <label class="form-label"
            ><strong>{{ form.link.label }}</strong></label
          >
          {{ form.link }} {{ form.link.errors }}
        </div>

        <div class="mb-3">
          <label class="form-label"
            ><strong>{{ form.observacao.label }}</strong></label
          >
          {{ form.observacao }} {{ form.observacao.errors }}
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-success w-50">
            <i class="fas fa-save me-2"></i>Salvar Alterações
          </button>
          <a
            href="{% url 'gerenciar_edicao' %}"
            class="btn btn-outline-danger w-50">
            <i class="fas fa-times me-2"></i>Cancelar
          </a>
        </div>
      </form>
    </div>
  </body>
</html>
