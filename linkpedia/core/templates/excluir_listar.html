<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Gerenciar Exclusão - LinkPedia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: white;
        min-height: 100vh;
        padding: 2rem 0;
      }
      .card-list {
        background-color: #f8f9fa;
        color: #343a40;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card card-list">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2>Painel de Exclusão de Links</h2>
          <a href="{% url 'home' %}" class="btn btn-outline-secondary"
            ><i class="fas fa-arrow-left me-2"></i>Voltar</a
          >
        </div>

        <form
          method="GET"
          action="{% url 'gerenciar_exclusao' %}"
          class="row g-2 mb-4">
          <div class="col-md-10">
            <input
              type="text"
              name="search"
              class="form-control"
              placeholder="Buscar por título ou URL..."
              value="{{ busca }}" />
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-dark w-100">
              <i class="fas fa-search me-2"></i>Filtrar
            </button>
          </div>
        </form>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Título</th>
                <th>Endereço URL</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody>
              {% for item in links %}
              <tr>
                <td><strong>{{ item.titulo }}</strong></td>
                <td>
                  <a href="{{ item.link }}" target="_blank">{{ item.link }}</a>
                </td>
                <td class="text-center">
                  <form
                    method="POST"
                    action="{% url 'excluir_link' item.pk %}"
                    onsubmit="return confirm('Tem certeza que deseja excluir o link \u201c{{ item.titulo }}\u201d?');"
                    style="display: inline">
                    {% csrf_token %}
                    <button
                      type="submit"
                      class="btn btn-danger btn-sm"
                      title="Excluir este link">
                      <i class="fas fa-trash-alt"></i>
                    </button>
                  </form>
                </td>
              </tr>
              {% empty %}
              <tr>
                <td colspan="3" class="text-center text-muted">
                  Nenhum link encontrado para exclusão.
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
